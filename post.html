<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-blog</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="post">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__brand" href="index.html">my-blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html">← 글 목록</a>
    <div id="content" aria-live="polite">
      <p class="notice">불러오는 중…</p>
    </div>
    <noscript><p class="notice">이 블로그는 JavaScript가 필요합니다.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">© my-blog</div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
